name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore IndustrialVisualAnomalyDetection.Desktop.slnx

      - name: Build solution
        run: dotnet build IndustrialVisualAnomalyDetection.Desktop.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test IndustrialVisualAnomalyDetection.Desktop.slnx --configuration Release --no-build
